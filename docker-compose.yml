services:
  db:
    # pgvector image kept so databases created by the original migration can boot.
    # The drop_embeddings migration removes the extension after startup.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-garagesage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-garagesage}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-garagesage}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garagesage

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-garagesage}:${DB_PASSWORD}@db:5432/${DB_NAME:-garagesage}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      UPLOADS_PATH: /app/uploads
      NODE_ENV: production
      PORT: 3000
    volumes:
      - uploads:/app/uploads
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - garagesage

volumes:
  db-data:
  uploads:

networks:
  garagesage:
    driver: bridge
