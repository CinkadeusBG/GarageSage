version: '3.9'

# Development override — run with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db ollama
# Then run api and frontend locally with: npm run dev

services:
  db:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: devpassword

  ollama:
    ports:
      - "11434:11434"
